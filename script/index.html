<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilder trennen</title>
<style>
  :root {
    --bg: #1d1f21; --panel: #2a2d30; --text: #e6e6e6; --muted: #9aa0a6;
    --accent: #ff9f1c; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); }
  header .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .count { color: var(--muted); white-space: nowrap; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: #3a3e42; border: 1px solid #4a4f54;
           border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button:hover:not(:disabled) { background: #464b50; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1d1f21; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ffb23f; }
  kbd { font: 11px ui-monospace, monospace; background: rgba(0,0,0,.25); border-radius: 3px; padding: 1px 5px; margin-left: 4px; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #stage { position: relative; display: inline-block; line-height: 0; user-select: none; touch-action: none; cursor: col-resize; }
  #img { max-width: calc(100vw - 24px); max-height: calc(100vh - 130px); display: block; }
  #band { position: absolute; top: 0; bottom: 0; background: rgba(255,159,28,.22); pointer-events: none; }
  #line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent); pointer-events: none; }
  #pos { position: absolute; top: 6px; transform: translateX(-50%); line-height: 1.4; background: var(--accent);
         color: #1d1f21; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 10px; pointer-events: none; white-space: nowrap; }
  footer { padding: 8px 16px; background: var(--panel); display: flex; gap: 16px; align-items: center; color: var(--muted); }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  #done { text-align: center; color: var(--muted); font-size: 18px; }
  .hidden { display: none !important; }
  #busy { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 14px; background: rgba(29,31,33,.72); font-size: 18px; }
  .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
             line-height: 1.4; background: rgba(29,31,33,.6); pointer-events: none; }
  #loading .spinner { width: 28px; height: 28px; border-width: 3px; }
  #quit { margin-left: 8px; }
  #bye { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
         background: var(--bg); font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="name" id="name">…</span>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button id="prev">←<kbd>←</kbd></button>
  <button id="skip">Überspringen<kbd>→</kbd></button>
  <button id="move" class="primary">nicht beschneiden<kbd>Enter</kbd></button>
  <button id="split" class="primary">Trennen<kbd>S</kbd></button>
  <button id="quit" title="Programm beenden (Server stoppen)">Beenden</button>
</header>
<main>
  <div id="stage" class="hidden">
    <img id="img" alt="" draggable="false">
    <div id="band"></div>
    <div id="line"><span id="pos"></span></div>
    <div id="loading" class="hidden"><span class="spinner"></span>Lade Vorschau …</div>
  </div>
  <div id="done" class="hidden">Alle Bilder im import-Ordner sind abgearbeitet.</div>
</main>
<div id="busy" class="hidden"><span class="spinner"></span><span id="busytext">Speichere …</span></div>
<div id="bye" class="hidden">Beendet. Du kannst diesen Tab schließen.</div>
<footer>
  <span>Linie ziehen oder ins Bild klicken · Feinjustierung mit <kbd>A</kbd>/<kbd>D</kbd> (0,1 %), mit <kbd>Shift</kbd> 1 %</span>
  <span id="msg"></span>
</footer>

<script>
const $ = id => document.getElementById(id);
let files = [], idx = 0, x = 0.5, overlap = 0.05, busy = false;

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function say(text, cls = '') { $('msg').textContent = text; $('msg').className = cls; }

function setX(v) {
  x = Math.min(0.999, Math.max(0.001, v));
  $('line').style.left = (x * 100) + '%';
  const lo = Math.max(0, x - overlap), hi = Math.min(1, x + overlap);
  $('band').style.left = (lo * 100) + '%';
  $('band').style.width = ((hi - lo) * 100) + '%';
  $('pos').textContent = (x * 100).toFixed(1).replace('.', ',') + ' %';
}

function show() {
  const empty = files.length === 0;
  $('stage').classList.toggle('hidden', empty);
  $('done').classList.toggle('hidden', !empty);
  for (const b of ['prev', 'skip', 'move', 'split']) $(b).disabled = empty;
  if (empty) { $('name').textContent = ''; $('count').textContent = ''; return; }
  idx = Math.min(Math.max(idx, 0), files.length - 1);
  $('name').textContent = files[idx];
  $('count').textContent = `Bild ${idx + 1} von ${files.length}`;
  $('loading').classList.remove('hidden');
  $('img').src = '/api/preview?name=' + encodeURIComponent(files[idx]);
  setX(0.5);
  if (files[idx + 1]) new Image().src = '/api/preview?name=' + encodeURIComponent(files[idx + 1]);
}

$('img').addEventListener('load', () => $('loading').classList.add('hidden'));
$('img').addEventListener('error', () => { $('loading').classList.add('hidden'); say('Vorschau konnte nicht geladen werden', 'err'); });

async function act(kind) {
  if (busy || !files.length) return;
  busy = true; say('');
  const name = files[idx];
  $('busytext').textContent = (kind === 'split' ? 'Trenne und speichere ' : 'Speichere ') + name + ' …';
  $('busy').classList.remove('hidden');
  try {
    const r = await api('/api/' + kind, kind === 'split' ? {name, x} : {name});
    files.splice(idx, 1);
    say(`✓ ${r.written.join(', ')}`, 'ok');
    show();
  } catch (e) {
    say(e.message, 'err');
  } finally { busy = false; $('busy').classList.add('hidden'); }
}

async function quit() {
  if (busy || !confirm('Programm beenden?')) return;
  try { await api('/api/quit', {}); } catch (e) { /* Server ist ggf. schon weg */ }
  $('bye').classList.remove('hidden');
}
$('quit').onclick = quit;

function pointerX(e) {
  const r = $('img').getBoundingClientRect();
  return (e.clientX - r.left) / r.width;
}
$('stage').addEventListener('pointerdown', e => {
  $('stage').setPointerCapture(e.pointerId);
  setX(pointerX(e));
});
$('stage').addEventListener('pointermove', e => {
  if ($('stage').hasPointerCapture(e.pointerId)) setX(pointerX(e));
});

$('move').onclick = () => act('move');
$('split').onclick = () => act('split');
$('skip').onclick = () => { idx++; if (idx >= files.length) idx = 0; show(); };
$('prev').onclick = () => { idx--; if (idx < 0) idx = files.length - 1; show(); };

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || busy) return;
  const step = e.shiftKey ? 0.01 : 0.001;
  switch (e.key) {
    case 'Enter': act('move'); break;
    case 's': case 'S': act('split'); break;
    case 'a': case 'A': setX(x - step); break;
    case 'd': case 'D': setX(x + step); break;
    case 'ArrowRight': $('skip').click(); break;
    case 'ArrowLeft': $('prev').click(); break;
    default: return;
  }
  e.preventDefault();
});

api('/api/files').then(r => { files = r.files; overlap = r.overlap; show(); })
  .catch(e => say(e.message, 'err'));
</script>
</body>
</html>
